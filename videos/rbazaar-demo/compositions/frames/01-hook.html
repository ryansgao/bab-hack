  <div id="root" data-composition-id="01-hook" data-width="1920" data-height="1080" data-duration="4.612">

        <ellipse id="01-hook-shadow" cx="1500" cy="814" rx="150" ry="10" fill="#1c1d18" opacity="0" />

  <script>
    (function () {
      const D = 4.112;
      const $ = (id) => document.getElementById("01-hook-" + id);
      const tl = gsap.timeline({ paused: true });

      // ---------- backdrop: blooms drift once across the frame ----------
      tl.fromTo($("bloom-rose"), { x: 0, y: 0 }, { x: 48, y: 22, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo($("bloom-sky"), { x: 0, y: 0 }, { x: -40, y: 30, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo($("bloom-mint"), { x: 0, y: 0 }, { x: -36, y: -24, duration: D, ease: "sine.inOut" }, 0);

      // ---------- Scene 1 (0–1.66): headline per-word on the VO + arm self-draws ----------
      const wordIn = (el, at) =>
        tl.fromTo(
          el,
          { opacity: 0, y: 44, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" },
          at,
        );
      // VO: Your 0.06 · robot 0.39 · has 0.88 · a 1.17 · body 1.26
      wordIn($("w1"), 0.04);
      wordIn($("w2"), 0.37);
      wordIn($("w3"), 0.86);
      wordIn($("w4"), 1.13);
      wordIn($("w5"), 1.24);

      // svg-path-draw: measured dash lengths
      const drawIds = ["bench", "base", "turret", "upper", "fore", "link", "palm", "finger-top", "finger-bot"];
      drawIds.forEach((id) => {
        const p = $(id);
        const len = Math.ceil((p.getTotalLength() || 1600) * 1.03);
        p.style.strokeDasharray = len + " " + len;
        p.style.strokeDashoffset = String(len);
      });
      const draw = (id, at, dur) => tl.to($(id), { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
      const fillIn = (id, at) =>
        tl.fromTo($(id), { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.35, ease: "power1.out" }, at);

      draw("bench", 0.08, 0.5);
      tl.fromTo($("shadow"), { opacity: 0 }, { opacity: 0.07, duration: 0.5, ease: "power1.out" }, 0.3);
      draw("base", 0.22, 0.42);
      fillIn("base", 0.6);
      draw("turret", 0.42, 0.2);
      draw("upper", 0.5, 0.48);
      fillIn("upper", 0.95);
      draw("fore", 0.84, 0.46);
      fillIn("fore", 1.26);
      draw("link", 1.12, 0.3);
      fillIn("link", 1.38);
      draw("palm", 1.26, 0.26);
      draw("finger-top", 1.4, 0.24);
      draw("finger-bot", 1.44, 0.24);

      // joints spring in as the pen passes them (small things: gentle overshoot)
      const pop = (el, at, from) =>
        tl.fromTo(
          el,
          { opacity: 0, scale: from || 0.6, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.6)" },
          at,
        );
      pop($("j1"), 0.6);
      pop($("j2"), 0.92);
      pop($("j3"), 1.22);
      pop($("j4"), 1.32);

      // ---------- Scene 2 (1.66–2.54): headline lifts + shrinks, token cycles ----------
      tl.to($("h1"), { y: -140, scale: 0.6, color: "#63665d", duration: 0.55, ease: "power3.out" }, 1.66);

      // VO: Every 1.74 · new 2.06 · job 2.29
      const lineIn = (el, at) =>
        tl.fromTo(
          el,
          { opacity: 0, y: 36, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "power3.out" },
          at,
        );
      lineIn($("l2w1"), 1.74);
      lineIn($("l2w2"), 1.96);
      lineIn($("l2w3"), 2.12);

      // pill arrives on a soft spring with the first token
      const T1 = 1.88;
      const T2 = 2.14;
      const T3 = 2.4;
      tl.fromTo(
        $("pill-wrap"),
        { opacity: 0, y: 56, scale: 0.88, transformOrigin: "0% 50%" },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)" },
        T1,
      );

      // discrete-text-sequence: hard-cut token states at thresholds (instant sets,
      // no tween on the text; set-based so it survives event-suppressed seeks)
      const pillEl = $("pill");
      const tokens = [$("tok1"), $("tok2"), $("tok3")];
      [T2, T3].forEach((t, i) => {
        tl.set(tokens[i], { opacity: 0 }, t);
        tl.set(tokens[i + 1], { opacity: 1 }, t);
      });
      // one pop per token swap
      [T2, T3].forEach((t) =>
        tl.fromTo(
          pillEl,
          { scale: 0.92 },
          { scale: 1, duration: 0.24, ease: "back.out(2)", immediateRender: false },
          t,
        ),
      );

      // matching icon springs into the gripper per token (previous one hard-cuts out)
      const icons = [
        [$("icon-person"), T1, T2],
        [$("icon-avocado"), T2, T3],
        [$("icon-label"), T3, null],
      ];
      icons.forEach(([el, tin, tout]) => {
        tl.fromTo(
          el,
          { opacity: 0, scale: 0.45, y: -16, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, y: 0, duration: 0.36, ease: "back.out(1.6)" },
          tin,
        );
        if (tout !== null) tl.set(el, { opacity: 0 }, tout);
      });

      // ---------- Scene 3 (2.52–4.112): "needs a new brain." + orb lands on the wrist ----------
      // VO: needs 2.52 · a 2.89 · new 2.98 · brain 3.40
      lineIn($("l3w1"), 2.5);
      lineIn($("l3w2"), 2.86);
      lineIn($("l3w3"), 2.96);
      tl.fromTo(
        $("l3w4"),
        { opacity: 0, y: 30, scale: 0.72, transformOrigin: "40% 75%" },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" },
        3.38,
      );

      // orb drops onto the wrist joint (gentle landing overshoot)
      tl.fromTo(
        $("orb"),
        { opacity: 0, y: -230, scale: 0.9, transformOrigin: "50% 50%" },
        { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "back.out(1.3)" },
        3.3,
      );
      // ambient-glow-bloom (bloom-and-hold): lands with the orb's settle
      tl.fromTo(
        $("glow"),
        { opacity: 0, scale: 0.82, transformOrigin: "50% 50%" },
        { opacity: 0.32, scale: 1, duration: 0.5, ease: "power2.out" },
        3.28,
      );

      // one subtle wrist tilt as it "powers on", then hold
      tl.fromTo(
        $("wrist"),
        { rotation: 0, svgOrigin: "1420 372" },
        { rotation: 6, svgOrigin: "1420 372", duration: 0.44, ease: "power2.inOut" },
        3.62,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["01-hook"] = tl;
    })();
  </script>
