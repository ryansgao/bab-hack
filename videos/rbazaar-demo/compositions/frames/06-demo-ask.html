  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const ID = "06-demo-ask";
      const DURATION = 6.507;
      const $ = (name) => document.getElementById(ID + "-" + name);

      const tl = gsap.timeline({ paused: true });

      // ---------------- layout constants (CSS px) ----------------
      const W = 1920;
      const H = 1080;
      const WIN_X = 76.8;
      const WIN_Y = 43.2;
      const APP_SCALE = 0.92;
      // composer glass box in app px: x 741–1401, y 366–512
      const COMPOSER_CX = (741 + 1401) / 2;
      const COMPOSER_CY = (366 + 512) / 2;
      const TARGET_OFFSET_X = WIN_X + COMPOSER_CX * APP_SCALE - W / 2;
      const TARGET_OFFSET_Y = WIN_Y + COMPOSER_CY * APP_SCALE - H / 2;

      // ---------------- background drift (one finite tween each) ----------------
      tl.fromTo($("bloom-rose"), { x: 0, y: 0 }, { x: 60, y: 30, duration: DURATION, ease: "sine.inOut" }, 0);
      tl.fromTo($("bloom-sky"), { x: 0, y: 0 }, { x: -50, y: 40, duration: DURATION, ease: "sine.inOut" }, 0);
      tl.fromTo($("bloom-mint"), { x: 0, y: 0 }, { x: 40, y: -30, duration: DURATION, ease: "sine.inOut" }, 0);

      // ---------------- Scene 1 (0.0–0.8): window settles, chip pops ----------------
      tl.fromTo(
        $("window"),
        { scale: 0.94, y: 24, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 1.0, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        $("chip"),
        { scale: 0.88, y: 46, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.5)" },
        0.32,
      );

      // ---------------- Scene 2: camera targets the composer ----------------
      // nested wrappers: outer scales about center, inner counter-translates by -offset
      const ZOOM_AT = 0.8;
      const ZOOM_DUR = 1.4;
      tl.fromTo($("zoom-outer"), { scale: 1 }, { scale: 1.95, duration: ZOOM_DUR, ease: "power3.inOut" }, ZOOM_AT);
      tl.fromTo(
        $("zoom-inner"),
        { x: 0, y: 0 },
        { x: -TARGET_OFFSET_X, y: -TARGET_OFFSET_Y, duration: ZOOM_DUR, ease: "power3.inOut" },
        ZOOM_AT,
      );
      // slow continuous push under the typing, decelerating into a lock before the submit
      tl.to($("zoom-outer"), { scale: 2.02, duration: 2.6, ease: "power1.out" }, ZOOM_AT + ZOOM_DUR);

      // ---------------- typing schedule (deterministic, character-by-character) ----------------
      const FULL =
        "Pick up the red mug on the cluttered workbench and set it on the tray. Slow down if a person\nwalks into the cell.";
      const T_TYPE_START = 1.5;
      const T_TYPE_END = 4.65;
      const weights = [];
      for (let i = 0; i < FULL.length; i++) {
        const ch = FULL[i];
        const prev = i > 0 ? FULL[i - 1] : "";
        let w = 1 + ((i * 37) % 7) * 0.09; // fixed human-ish jitter
        if (ch === " " || ch === "\n") w += 0.55;
        if (prev === ".") w += 3.2; // breath after a sentence
        if (prev === " " && i > 0 && FULL.slice(i, i + 4) === "tray") w += 0.8;
        weights.push(w);
      }
      weights[0] = 0;
      const total = weights.reduce((a, b) => a + b, 0);
      const KEY_T = [];
      let acc = 0;
      for (let i = 0; i < FULL.length; i++) {
        acc += weights[i];
        KEY_T.push(T_TYPE_START + (acc / total) * (T_TYPE_END - T_TYPE_START));
      }
      function countAt(t) {
        let n = 0;
        while (n < KEY_T.length && KEY_T[n] <= t) n++;
        return n;
      }

      // caret segments: sage while typing the mission's key terms
      const ACCENT_RANGES = ["red mug", "tray", "Slow down"].map((s) => {
        const a = FULL.indexOf(s);
        return [a, a + s.length];
      });
      function caretColor(n) {
        for (const [a, b] of ACCENT_RANGES) if (n > a && n <= b) return "#3f7d5c";
        return "#1c1d18";
      }

      const T_CARET_ON = 1.0;
      const T_PRESS = 5.55;
      const TYPING_GRACE = 0.22;
      const BLINK_PERIOD = 1.0;

      const textEl = $("text");
      const caretEl = $("caret");
      const patchEl = $("patch");
      const driver = { t: 0 };
      tl.fromTo(
        driver,
        { t: 0 },
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: () => {
            const t = driver.t;
            const n = countAt(t);
            textEl.textContent = FULL.slice(0, n);
            patchEl.style.opacity = n > 0 ? "1" : "0";
            let on = false;
            if (t >= T_CARET_ON && t < T_PRESS) {
              const last = n > 0 ? KEY_T[n - 1] : -1;
              const typing = n > 0 && t - last < TYPING_GRACE;
              on = typing || Math.sin(((t - T_CARET_ON) / BLINK_PERIOD) * Math.PI * 2 + Math.PI / 2) > -0.2;
            }
            caretEl.style.opacity = on ? "1" : "0";
            caretEl.style.background = caretColor(n);
          },
        },
        0,
      );

      // send button wakes up (grey -> sage) on the first keystroke
      const T_FIRST_KEY = KEY_T[0];
      tl.fromTo(
        $("send"),
        { opacity: 0, scale: 0.86 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.6)" },
        T_FIRST_KEY,
      );

      // ---------------- Scene 3 (4.9–6.5): cursor arrives, press, spinner ----------------
      const T_CURSOR_IN = 4.85;
      const MOVE_DUR = 0.55;
      tl.fromTo($("cursor"), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, T_CURSOR_IN);
      tl.fromTo(
        $("cursor"),
        { x: 120, y: 78 },
        { x: 0, y: 0, duration: MOVE_DUR, ease: "back.out(1.3)" },
        T_CURSOR_IN,
      );

      const PRESS_DUR = 0.12;
      const T_RELEASE = T_PRESS + PRESS_DUR;
      // press: linear-ish compression (cursor compresses more than the target)
      tl.to($("cursor"), { scale: 0.84, duration: PRESS_DUR, ease: "power1.in" }, T_PRESS);
      tl.to(
        $("send"),
        { scale: 0.88, backgroundColor: "#2a543d", duration: PRESS_DUR, ease: "power1.in" },
        T_PRESS,
      );
      // release: spring back
      tl.to($("cursor"), { scale: 1, duration: 0.45, ease: "back.out(2)" }, T_RELEASE);
      tl.to(
        $("send"),
        { scale: 1, backgroundColor: "#3f7d5c", duration: 0.55, ease: "back.out(2)" },
        T_RELEASE,
      );
      // burst glow behind the button
      tl.fromTo(
        $("burst"),
        { scale: 1, opacity: 0 },
        { scale: 2.6, opacity: 0.55, duration: 0.3, ease: "power2.out" },
        T_RELEASE,
      );
      tl.to($("burst"), { opacity: 0, duration: 0.45, ease: "power2.in" }, T_RELEASE + 0.3);
      // ripple rings from the click point
      tl.fromTo(
        [$("ripple-1"), $("ripple-2")],
        { scale: 0.9, opacity: 0.75 },
        { scale: 2.7, opacity: 0, duration: 0.7, ease: "power2.out", stagger: 0.09, immediateRender: false },
        T_PRESS + 0.04,
      );
      // arrow -> spinner swap
      tl.to($("arrow"), { scale: 0.4, opacity: 0, duration: 0.14, ease: "power2.in" }, T_RELEASE);
      tl.fromTo(
        $("spinner"),
        { scale: 0.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(1.6)" },
        T_RELEASE + 0.08,
      );
      tl.fromTo(
        $("spinner"),
        { rotation: 0 },
        { rotation: 540, duration: DURATION - T_RELEASE, ease: "none" },
        T_RELEASE,
      );
      // cursor eases a touch off the button so the spinner reads
      tl.to($("cursor"), { x: 12, y: 16, duration: 0.5, ease: "power2.out" }, T_RELEASE + 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
