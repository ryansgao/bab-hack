      // ---------- Scene 2 (1.6–3.4): bars race + counters (one chord: same start, dur, ease) ----------

      const COUNT_DUR = 1.3;
      const COUNT_EASE = "power3.out";

      const cb = $("f12-numbers-count-b");

      const sb = { v: 0 };

      tl.fromTo("#f12-numbers-fill-b", { scaleX: 0 }, { scaleX: 0.4, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
      tl.fromTo(sa, { v: 0 }, { v: 75, duration: COUNT_DUR, ease: COUNT_EASE, onUpdate: () => { ca.textContent = Math.round(sa.v); } }, COUNT_AT);
      tl.fromTo(sb, { v: 0 }, { v: 40, duration: COUNT_DUR, ease: COUNT_EASE, onUpdate: () => { cb.textContent = Math.round(sb.v); } }, COUNT_AT);
      tl.fromTo([ca, cb], { scale: 0.55 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
      // suffix lands after the count
      tl.fromTo(["#f12-numbers-suffix-a", "#f12-numbers-suffix-b"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)", stagger: 0.06 }, COUNT_AT + COUNT_DUR);

      tl.fromTo("#f12-numbers-caption-pill", { opacity: 0, y: 44, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.5)" }, 2.55);

      // ---------- Scene 3 seam (3.4–3.6): forward zoom-through punch ----------
      tl.fromTo("#f12-numbers-bars-stage", { scale: 1.03, filter: "blur(0px)" }, { scale: 1.24, filter: "blur(18px)", duration: 0.2, ease: "power3.in", immediateRender: false }, 3.4);

      tl.fromTo("#f12-numbers-hero-stage", { opacity: 0.15, scale: 0.75, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 3.6);

      const HERO_AT = 3.6;
      const HERO_DUR = 1.7;
      const hero = $("f12-numbers-hero");
      const sh = { v: 0 };
      tl.fromTo(sh, { v: 0 }, { v: 62, duration: HERO_DUR, ease: "power3.out", onUpdate: () => { hero.textContent = Math.round(sh.v); } }, HERO_AT);
      tl.fromTo(hero, { scale: 0.5 }, { scale: 1, duration: HERO_DUR, ease: "power3.out" }, HERO_AT);
      tl.fromTo("#f12-numbers-glow", { opacity: 0, scale: 0.8 }, { opacity: 0.85, scale: 1, duration: 1.6, ease: "power2.out" }, 3.7);
      tl.fromTo("#f12-numbers-hero-label", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 3.95);

      const rows = gsap.utils.toArray("#f12-numbers-checks .f12-numbers-check-row");

        const at = 4.3 + i * 0.18;

        tl.fromTo(row.querySelector(".f12-numbers-badge"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, at + 0.1);
      });

      // YOLO chip springs in bottom-left
      tl.fromTo("#f12-numbers-chip", { opacity: 0, y: 50, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.5)" }, 5.6);

      // hold: one finite airy drift on the checklist card
      tl.fromTo("#f12-numbers-checks", { y: 0 }, { y: -5, duration: 1.3, ease: "sine.inOut" }, 5.55);

      window.__timelines["12-numbers"] = tl;
    })();
