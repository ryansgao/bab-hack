  <script>
    (function () {
      const D = 6.395;
      const tl = gsap.timeline({ paused: true });
      const byId = (id) => document.getElementById(id);
      const byClass = (c) => Array.from(document.querySelectorAll('[class~="' + c + '"]'));
      const num = (el, k) => Number(el.dataset[k]);

      const SPRING = "back.out(1.4)"; // gentle overshoot (< ~8%) — sanctioned bouncy grammar for small things
      const PUSH_AT = 4.45; // VO "and how does a robot pay?" begins at 4.51
      const SHOVE_DUR = 0.6;

      // ---------- background blooms: ONE finite drift ----------
      const blooms = byClass("02-problem-bloom");
      tl.fromTo(
        blooms,
        { x: 0, y: 0 },
        { x: (i, el) => num(el, "dx"), y: (i, el) => num(el, "dy"), duration: D, ease: "sine.inOut" },
        0,
      );

      // ---------- camera: slow zoom-out under accumulation -> quick push-in -> forward creep ----------
      const camera = byId("02-problem-camera");
      const phase = { scale: 1 };
      tl.to(phase, { scale: 0.92, duration: PUSH_AT - 1.3, ease: "sine.inOut" }, 1.3);
      tl.to(phase, { scale: 1.07, duration: SHOVE_DUR, ease: "expo.out" }, PUSH_AT);
      tl.to(phase, { scale: 1.085, duration: D - (PUSH_AT + SHOVE_DUR), ease: "none" }, PUSH_AT + SHOVE_DUR);
      const drift = { p: 0 };
      const writeCamera = () => {
        const dx = Math.sin(drift.p) * 4;
        const dy = Math.sin(drift.p * 1.3) * 2;
        camera.style.transform = "scale(" + phase.scale + ") translate(" + dx + "px, " + dy + "px)";
      };
      tl.to(drift, { p: Math.PI * 2, duration: D, ease: "none", onUpdate: writeCamera }, 0);

      // ---------- robot glyph (focal) ----------
      const robot = byId("02-problem-robot");
      tl.fromTo(
        robot,
        { xPercent: -50, yPercent: -50, x: 0, y: 24, scale: 0.88, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: SPRING },
        0,
      );
      tl.fromTo(robot, { y: 0 }, { y: -6, duration: PUSH_AT - 1.0, ease: "sine.inOut", immediateRender: false }, 1.0);
      tl.fromTo(
        robot,
        { y: -6, scale: 1 },
        { y: -125, scale: 0.78, duration: 0.75, ease: "power3.out", immediateRender: false },
        PUSH_AT,
      );

      // ---------- Scene 1: 12 cards spring out from the cluster (center-outward-expansion) ----------
      byClass("02-problem-s1").forEach((el, i) => {
        const tx = num(el, "x");
        const ty = num(el, "y");
        const s = num(el, "s");
        const isFar = el.classList.contains("02-problem-far");
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: tx * 0.3, y: ty * 0.3, scale: s * 0.6, opacity: 0 },
          { x: tx, y: ty, scale: s, opacity: isFar ? 0.85 : 1, duration: 0.75, ease: SPRING },
          0.12 + i * 0.06,
        );
      });

      // ---------- Scene 2: 6 more cards pile in from the edges ----------
      byClass("02-problem-s2").forEach((el) => {
        const tx = num(el, "x");
        const ty = num(el, "y");
        const s = num(el, "s");
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: tx + num(el, "fx") * 420, y: ty + num(el, "fy") * 260, scale: s * 0.88, opacity: 0 },
          { x: tx, y: ty, scale: s, opacity: 1, duration: 0.6, ease: SPRING },
          num(el, "at"),
        );
      });

      // ---------- Scene 2: question chips pop as the VO names them ----------
      byClass("02-problem-chip").forEach((el) => {
        const tx = num(el, "x");
        const ty = num(el, "y");
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: tx, y: ty + 54, scale: 0.88, opacity: 0 },
          { y: ty, scale: 1, opacity: 1, duration: 0.55, ease: SPRING },
          num(el, "at"),
        );
      });

      // ---------- Scene 3: push-in shoves all clutter to the frame edges ----------
      // edge target = position scaled out onto an ellipse hugging the frame (never inward)
      const edge = (x, y) => {
        const k = Math.max(1.12, 1 / Math.sqrt((x / 900) * (x / 900) + (y / 420) * (y / 420)));
        return [x * k, y * k];
      };
      byClass("02-problem-item")
        .filter((el) => el !== robot)
        .forEach((el, i) => {
          const tx = num(el, "x");
          const ty = num(el, "y");
          const [ex, ey] = edge(tx, ty);
          tl.fromTo(
            el,
            { x: tx, y: ty },
            { x: ex, y: ey, duration: SHOVE_DUR, ease: "expo.out", immediateRender: false },
            PUSH_AT + (i % 4) * 0.012,
          );
        });

      // motion-blur envelope on the clutter layer (camera-travel carve-out, depth "B B" axis for a push)
      const clutter = byId("02-problem-clutter");
      const blurNode = byId("02-problem-streak-blur");
      const blur = { v: 0 }; // seeded at 0: the streak lives mid-shot, not at t=0
      const writeBlur = () => {
        blurNode.setAttribute("stdDeviation", blur.v + " " + blur.v);
        clutter.style.filter = blur.v > 0.05 ? "url(#02-problem-streak)" : "none";
      };
      writeBlur();
      tl.to(blur, { v: 12, duration: 0.06, ease: "none", onUpdate: writeBlur }, PUSH_AT);
      tl.to(blur, { v: 0, duration: SHOVE_DUR - 0.06, ease: "expo.out", onUpdate: writeBlur }, PUSH_AT + 0.06);

      // ---------- Scene 3: serif question builds per word on the VO ----------
      byClass("02-problem-word").forEach((el) => {
        tl.fromTo(el, { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, num(el, "at"));
      });
      tl.fromTo(
        byId("02-problem-coin"),
        { y: 30, scale: 0.6, rotation: -20, opacity: 0 },
        { y: 0, scale: 1, rotation: 0, opacity: 1, duration: 0.6, ease: SPRING },
        5.62,
      );
      tl.fromTo(
        byId("02-problem-coin-q"),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: SPRING },
        5.8,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["02-problem"] = tl;
    })();
  </script>
</template>
