      const root = document.querySelector('[data-composition-id="14-reconcile"]');
      const tiles = root.getElementsByClassName("14-reconcile-tile");
      const words = root.getElementsByClassName("14-reconcile-word");
      const spring = "back.out(1.5)";

      const tl = gsap.timeline({ paused: true });

      // ---------- atmosphere: one finite drift per bloom ----------
      tl.fromTo($("bloom-rose"), { x: 0, y: 0 }, { x: 60, y: 30, duration: 6.36, ease: "sine.inOut" }, 0);
      tl.fromTo($("bloom-sky"), { x: 0, y: 0 }, { x: -50, y: 40, duration: 6.36, ease: "sine.inOut" }, 0);
      tl.fromTo($("bloom-mint"), { x: 0, y: 0 }, { x: 40, y: -36, duration: 6.36, ease: "sine.inOut" }, 0);

      // ---------- Scene 1 (0.0–1.8): the payment flies and freezes ----------
      tl.fromTo($("label"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo($("path"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: "power2.out" }, 0.05);
      tl.fromTo($("robot"), { opacity: 0, y: 40, scale: 0.88 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: spring }, 0.0);
      tl.fromTo($("vendor"), { opacity: 0, y: 40, scale: 0.88 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: spring }, 0.1);
      tl.fromTo($("arrive"), { opacity: 0, scale: 0.4 }, { opacity: 0, scale: 0.4, duration: 0.01 }, 0);

      // packet pops beside the robot, then flies right and halts hard at center
      tl.fromTo($("packet"), { xPercent: -50, x: 540, opacity: 0, scale: 0.9 }, { xPercent: -50, x: 540, opacity: 1, scale: 1, duration: 0.45, ease: spring }, 0.08);
      tl.to($("packet"), { x: 960, duration: 0.72, ease: "power1.in" }, 0.45);
      // freeze glitch: deterministic jitter frames
      tl.set($("packet"), { x: 970, skewX: -4 }, 1.17);
      tl.set($("packet"), { x: 953, skewX: 3 }, 1.21);
      tl.set($("packet"), { x: 964, skewX: -1.5 }, 1.25);
      tl.set($("packet"), { x: 958, skewX: 0 }, 1.29);
      tl.set($("packet"), { x: 960 }, 1.33);
      tl.fromTo($("ring-peach"), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, 1.17);
      tl.fromTo($("ring-sage"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo($("coin"), { backgroundColor: "#3f7d5c" }, { backgroundColor: "#bdb9ad", duration: 0.25, ease: "power2.out" }, 1.17);
      tl.fromTo($("crack-path"), { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, 1.2);

      // status chip: peach "uncertain"
      tl.fromTo($("chip-peach"), { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: spring }, 1.36);
      tl.fromTo($("chip-sage"), { opacity: 0, scale: 0.86 }, { opacity: 0, scale: 0.86, duration: 0.01 }, 0);
