        bounty: [[872, 418], [800, 480], [720, 560], [662, 616]],

      const bez = (c, t) => {

      const W = {
        robot: wire("scout04-w-robot", curves.robot),
        trunk: wire("scout04-w-trunk", curves.trunk),
        brL: wire("scout04-w-br-l", curves.brL),
        brR: wire("scout04-w-br-r", curves.brR),
        p0: wire("scout04-w-p0", curves.p0),
        p1: wire("scout04-w-p1", curves.p1),
        p2: wire("scout04-w-p2", curves.p2),
        bounty: wire("scout04-w-bounty", curves.bounty),
      };
      const draw = (el, at, dur) => tl.fromTo(el, { strokeDashoffset: el.style.strokeDashoffset }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);

      // ---- ambient: blooms drift on one finite tween each ----
      tl.fromTo(q("#scout04-bloom-rose"), { x: 0, y: 0 }, { x: 52, y: -20, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo(q("#scout04-bloom-sky"), { x: 0, y: 0 }, { x: -44, y: 26, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo(q("#scout04-bloom-mint"), { x: 0, y: 0 }, { x: 34, y: 22, duration: DUR, ease: "sine.inOut" }, 0);

      // ---- Scene 1 (0.0–1.6s): Scout hub springs in, glow blooms, name + role ----
      tl.fromTo(q("#scout04-hub"), { scale: 0.86, opacity: 0, y: 40 }, { scale: 1, opacity: 1, y: 0, duration: 0.75, ease: SPRING }, 0.08);
      tl.fromTo(q("#scout04-core"), { scale: 0.6 }, { scale: 1, duration: 0.8, ease: SPRING }, 0.22);
      tl.fromTo(q("#scout04-glow"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: "power3.out" }, 0.2);
      tl.fromTo(q("#scout04-name"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.45);
      tl.fromTo(q("#scout04-sub"), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.62);

      // ---- Scene 2 (1.6–3.6s): Robot Card slides in, scan reads it, wire draws to hub ----
      tl.fromTo(q("#scout04-robot"), { x: -90, opacity: 0, scale: 0.92 }, { x: 0, opacity: 1, scale: 1, duration: 0.8, ease: SPRING }, 1.6);
      tl.fromTo(q("#scout04-file"), { x: -60, y: 30, rotation: 0, opacity: 0 }, { x: 0, y: 0, rotation: 7, opacity: 1, duration: 0.7, ease: SPRING }, 1.82);
      const SCAN_AT = 2.15, SCAN_DUR = 0.9, CARD_H = 364, SCAN_H = 64;
      tl.fromTo(q("#scout04-scan"), { y: -SCAN_H }, { y: CARD_H, duration: SCAN_DUR, ease: "none" }, SCAN_AT);
      qa("#scout04-robot .scout04-row svg").forEach((el, i) => {
        const rowMid = 26 + 42 + 14 + i * 42 + 21; // padding + title + gap + rows
        const at = SCAN_AT + (SCAN_DUR * (rowMid + SCAN_H)) / (CARD_H + SCAN_H);
        tl.fromTo(el, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: SPRING }, at);
      });
      draw(W.robot, 2.95, 0.6);

      // ---- Scene 3 (3.6–5.3s): goal pill pops, splits into three skills ----
      draw(W.trunk, 3.6, 0.4);
      tl.fromTo(q("#scout04-goal"), { y: 50, scale: 0.88, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: SPRING }, 3.72);
      // skills start stacked at the goal's centre, then spring out to their slots
      const goalC = { x: 960, y: 76 };
      [745, 960, 1175].forEach((cx, i) => {
        tl.fromTo(
          q("#scout04-sk" + i),
          { x: goalC.x - cx, y: goalC.y - 164, scale: 0.6, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.6, ease: SPRING },
          4.25 + i * 0.1
        );
      });
      draw(W.brL, 4.4, 0.45);
      draw(W.brR, 4.5, 0.45);

      // ---- Scene 4 (5.3–7.4s): producer listings spring in, AUSD coins pay each ----
      [0, 1, 2].forEach((i) => {
        tl.fromTo(q("#scout04-prod" + i), { x: 70, y: 30, scale: 0.9, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.7, ease: SPRING }, 5.32 + i * 0.11);
      });
      draw(W.p0, 5.75, 0.5);
      draw(W.p1, 5.85, 0.5);
      draw(W.p2, 5.95, 0.5);
      [curves.p0, curves.p1, curves.p2].forEach((c, i) => {
        const at = 6.2 + i * 0.3;
        const TRAVEL = 0.55;
        const pts = [];
        for (let k = 0; k <= 12; k++) pts.push(bez(c, k / 12));
        const coin = q("#scout04-coin" + i);
        tl.fromTo(coin, { x: pts[0].x, y: pts[0].y, scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power2.out" }, at);
        tl.to(coin, { keyframes: { x: pts.slice(1).map((p) => p.x), y: pts.slice(1).map((p) => p.y), easeEach: "none" }, duration: TRAVEL, ease: "power1.inOut" }, at);
        // coin lands in the listing: absorbed + ping ring + price nudge
        tl.to(coin, { scale: 0.4, opacity: 0, duration: 0.16, ease: "power2.in" }, at + TRAVEL);
        const ping = q("#scout04-ping" + i);
        tl.fromTo(ping, { scale: 0.4, opacity: 0 }, { scale: 0.7, opacity: 0.85, duration: 0.08, ease: "none" }, at + TRAVEL);
        tl.to(ping, { scale: 1.9, opacity: 0, duration: 0.55, ease: "power2.out" }, at + TRAVEL + 0.08);
        const price = q("#scout04-prod" + i + " .scout04-price b");
        tl.fromTo(price, { scale: 1 }, { scale: 1.16, duration: 0.12, ease: "power2.out" }, at + TRAVEL);
        tl.to(price, { scale: 1, duration: 0.4, ease: SPRING }, at + TRAVEL + 0.12);
      });

      // ---- Scene 5 (7.4–10.2s): nothing fits -> flag, Wanted, real bounty card, producer reply ----
      draw(W.bounty, 7.4, 0.45);
      tl.fromTo(q("#scout04-flag"), { y: 40, scale: 0.86, opacity: 0, rotation: -10 }, { y: 0, scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: SPRING }, 7.6);
      tl.fromTo(q("#scout04-wanted"), { y: 40, scale: 0.88, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: SPRING }, 7.72);
      tl.fromTo(q("#scout04-bounty"), { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 1.0, ease: "expo.out" }, 7.9);
      tl.fromTo(q("#scout04-crop img"), { scale: 1.04 }, { scale: 1, duration: 1.2, ease: "power3.out" }, 7.9);
      tl.fromTo(q("#scout04-reply"), { x: -20, y: -16, scale: 0.6, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.6, ease: SPRING }, 8.75);
      tl.fromTo(q("#scout04-reply .scout04-ok"), { scale: 0.4 }, { scale: 1, duration: 0.45, ease: SPRING }, 8.9);

      // Hold: the hub takes one finite float while the constellation rests.
      tl.fromTo(q("#scout04-hub"), { y: 0 }, { y: -6, duration: DUR - 8.4, ease: "sine.inOut", immediateRender: false }, 8.4);
      tl.fromTo(q("#scout04-glow"), { y: 0 }, { y: -6, duration: DUR - 8.4, ease: "sine.inOut" }, 8.4);

      tl.set({}, {}, DUR);
      window.__timelines["04-scout"] = tl;
    })();
  </script>
</template>
