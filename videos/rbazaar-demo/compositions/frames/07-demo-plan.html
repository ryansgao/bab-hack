      var tl = gsap.timeline({ paused: true });

      /* ---- virtual camera (viewport-change, single wrapper, T = -offset x S) ---- */

      var cam = { s: 1, x: 0, y: 0 };
      function applyCamera() {
        world.style.transform = "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.s + ")";

      // Scene 2: glide right onto the Selected card — focus (1227, 440) at S 1.4

      tl.fromTo(cam, { s: 1, x: 0, y: 0 }, { s: CAM2.s, x: CAM2.x, y: CAM2.y, duration: 1.25, ease: "power3.inOut", onUpdate: applyCamera }, 1.8);
      tl.fromTo(cam, { s: CAM2.s, x: CAM2.x, y: CAM2.y }, { s: CAM3.s, x: CAM3.x, y: CAM3.y, duration: 1.05, ease: "power3.inOut", onUpdate: applyCamera, immediateRender: false }, 6.0);

      /* ---- Scene 1: plate + working chip + plan rows cascade ---- */
      tl.fromTo(byId("plate"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 0);

      var statusWrap = byId("status-wrap");

      tl.fromTo(status, { xPercent: -50 }, { xPercent: 0, duration: 0.85, ease: "power3.inOut", immediateRender: false }, 1.85);

      var spin = { r: 0 };

      }, 0.08);
      // flip: spinner -> check (scale swap at same center), label swap
      tl.fromTo(byId("spinner"), { scale: 1, opacity: 1 }, { scale: 0.4, opacity: 0, duration: 0.18, ease: "power2.in", transformOrigin: "50% 50%" }, 1.62);
      tl.fromTo(byId("check"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.7)", transformOrigin: "50% 50%" }, 1.7);
      var checkPath = byId("check-path");

      tl.fromTo(checkPath, { strokeDashoffset: cLen + 10 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 1.74);

      tl.fromTo(q(".f07-status-labels"), { width: 282 }, { width: 176, duration: 0.5, ease: "power3.inOut" }, 1.66);
      tl.fromTo(byId("label-b"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 1.72);

        var t = 0.32 + i * 0.18;
        tl.fromTo(row, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.out" }, t);
        tl.fromTo(row, { y: 16, scale: 0.97 }, { y: 0, scale: 1, duration: 0.55, ease: "back.out(1.5)" }, t);
      });
      var run = q(".f07-run");
      tl.fromTo(run, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power2.out" }, 1.42);
      tl.fromTo(run, { y: 14, scale: 0.97 }, { y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 1.42);

      /* ---- Scene 2: provider panel undims, criteria pills, selected ring ---- */
      tl.fromTo(byId("veil-prov"), { opacity: 1 }, { opacity: 0, duration: 0.8, ease: "power2.out" }, 1.85);
      tl.fromTo(q(".f07-score"), { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 1.85);
      tl.fromTo(byId("veil-plan"), { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 2.0);

      tl.fromTo(byId("tray"), { y: -40, scale: 0.94, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 2.3);
      var pillTimes = [2.6, 3.3, 3.9, 4.5];
      qa(".f07-cpill").forEach(function (p, i) {
        tl.fromTo(p, { y: 56, scale: 0.88, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.5)" }, pillTimes[i] - 0.05);
      });

      // sage ring draws around the Selected card (svg-path-draw)
      var ring = byId("ring");
      var rLen = ring.getTotalLength();
      ring.style.strokeDasharray = rLen + " " + (rLen + 20);
      tl.fromTo(ring, { strokeDashoffset: rLen + 10 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 4.65);
      tl.fromTo(byId("halo"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 5.0);

      // asr-keyword-glow: one linear driver over all spoken words (+ the score)
      var TIMINGS = {
        price: { start: 2.6, end: 3.05 },
        speed: { start: 3.3, end: 3.7 },
        quality: { start: 3.9, end: 4.35 },
        risk: { start: 4.5, end: 4.85 },
        score: { start: 4.95, end: 5.9 }
      };
      var ATTACK_DUR = 0.15, RELEASE = 0.4, REST_LEVEL = 0.22, MAX_BLUR = 20;
      var REST_RGB = { r: 28, g: 29, b: 24 }, ACTIVE_RGB = { r: 63, g: 125, b: 92 };
      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }
      function lerp(a, b, t) { return Math.round(a + (b - a) * t); }
      var words = qa(".f07-word");
      var driver = { t: 0 };
      tl.fromTo(driver, { t: 0 }, {
        t: D, duration: D, ease: "none",
        onUpdate: function () {
          words.forEach(function (el) {
            var timing = TIMINGS[el.dataset.word];
            if (!timing) return;
            var env = envelope(driver.t, timing.start, timing.end);
            var boost = parseFloat(el.dataset.maxScale);
            el.style.textShadow = "0 0 " + (MAX_BLUR * env) + "px rgba(63,125,92," + (0.75 * env) + ")";
            el.style.transform = "scale(" + (1 + boost * env) + ")";
            el.style.color = "rgb(" + lerp(REST_RGB.r, ACTIVE_RGB.r, env) + "," + lerp(REST_RGB.g, ACTIVE_RGB.g, env) + "," + lerp(REST_RGB.b, ACTIVE_RGB.b, env) + ")";
          });
        }
      }, 0);

      /* ---- Scene 3: crossfade to scrolled provider view, strike the excluded ---- */
      tl.fromTo(byId("prov"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.inOut" }, 5.6);
      tl.fromTo(byId("scroller"), { y: 0 }, { y: -211, duration: 1.05, ease: "power3.inOut" }, 6.0);

      var strikes = qa(".f07-strike");
      var washes = qa(".f07-wash");
      var xpills = qa(".f07-xpill");
      [6.95, 7.3, 7.65].forEach(function (t, i) {
        var len = strikes[i].getTotalLength();
        strikes[i].style.strokeDasharray = len + " " + (len + 20);
        tl.fromTo(washes[i], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, t);
        tl.fromTo(strikes[i], { strokeDashoffset: len + 10 }, { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, t);
        tl.fromTo(xpills[i], { scale: 0.6, opacity: 0, transformOrigin: "100% 50%" }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)", transformOrigin: "100% 50%" }, t + 0.3);
      });

      var reasons = qa(".f07-reason");
      [7.3, 7.7].forEach(function (t, i) {
        tl.fromTo(reasons[i], { x: -40, scale: 0.9, opacity: 0 }, { x: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.5)" }, t);
      });

      var stamp = byId("stamp");
      tl.fromTo(stamp, { y: 60, scale: 0.88, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.65, ease: "back.out(1.5)" }, 8.25);
      // airy hero float on the final stamp over the hold (finite, 5px)
      tl.fromTo(stamp, { y: 0 }, { y: -5, duration: 0.6, ease: "sine.inOut", immediateRender: false }, 8.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["07-demo-plan"] = tl;
    })();
  </script>
</template>
