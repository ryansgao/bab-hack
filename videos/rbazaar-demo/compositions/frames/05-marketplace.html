  <script>
    (function () {
      var ID = "05-marketplace";
      var $ = function (id) {
        return document.getElementById(ID + "-" + id);
      };
      var tl = gsap.timeline({ paused: true });
      var DUR = 5.492;

      // ---- background: one finite drift per bloom ----
      tl.fromTo($("bloom-rose"), { x: 0, y: 0 }, { x: 70, y: 40, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo($("bloom-sky"), { x: 0, y: 0 }, { x: -60, y: 50, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo($("bloom-mint"), { x: 0, y: 0 }, { x: -50, y: -40, duration: DUR, ease: "sine.inOut" }, 0);

      // ---- Scene 1 (0.0-1.8): plate rises into 3D tilt, page scrolls; 1,186 counts up ----
      var plate = $("plate");
      tl.fromTo(
        plate,
        { y: 320, rotationX: 24, rotationY: -10, opacity: 0 },
        { y: 0, rotationX: 14, rotationY: -10, opacity: 1, duration: 1.2, ease: "expo.out" },
        0,
      );

      var shot = $("shot");
      // multi-step scroll, same ease, non-overlapping windows (max travel 178px)
      tl.fromTo(shot, { y: 0 }, { y: -95, duration: 1.6, ease: "power3.out" }, 0.55);
      tl.to(shot, { y: -170, duration: 1.6, ease: "power3.out" }, 2.75);

      // counting-dynamic-scale: value + scale share timing and ease
      function countUp(el, target, at, dur, startScale) {
        var state = { v: 0 };
        tl.fromTo(
          state,
          { v: 0 },
          {
            v: target,
            duration: dur,
            ease: "power3.out",
            onUpdate: function () {
              el.textContent = Math.round(state.v).toLocaleString("en-US");
            },
          },
          at,
        );
        tl.fromTo(el, { scale: startScale }, { scale: 1, duration: dur, ease: "power3.out" }, at);
      }

      var heroNum = $("hero-num");
      tl.fromTo($("hero"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.05);
      countUp(heroNum, 1186, 0.1, 1.5, 0.5);
      tl.fromTo(
        $("hero-label"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.45,
      );

      // ---- Scene 2 (1.8-3.0): 22 vendors, then 38 capabilities pops beside ----
      tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 1.7);

      tl.fromTo($("vendors"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.8);
      countUp($("vendors-num"), 22, 1.8, 1.0, 0.55);
      tl.fromTo(
        $("vendors-label"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        1.95,
      );

      tl.fromTo(
        $("caps"),
        { opacity: 0, y: 50, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.5)" },
        2.4,
      );
      countUp($("caps-num"), 38, 2.4, 0.75, 0.6);

      // ---- Scene 3 (3.0-5.5): tilt-to-flatten + bookend push; model chips spring in ----
      tl.to(plate, { rotationX: 4, rotationY: -3, duration: 1.5, ease: "power3.inOut" }, 3.0);
      var stage = $("stage");
      tl.fromTo(stage, { scale: 1 }, { scale: 1.045, duration: 1.0, ease: "power2.out" }, 3.0);
      tl.to(stage, { scale: 1, duration: 1.3, ease: "power2.inOut" }, 4.0);

      var chips = document.querySelectorAll('[id="05-marketplace-chips"] [class~="05-marketplace-chip"]');
      tl.fromTo(
        chips,
        { opacity: 0, y: 60, scale: 0.88 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.5)", stagger: 0.1 },
        3.15,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
