            <div id="13-broke-c3-conf1" class="13-broke-conf">
              <div id="13-broke-c3-fill1" class="13-broke-conf-fill"></div>
              <svg viewBox="0 0 64 64" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path id="13-broke-c3-tick1" d="M20 33l8 8 16-18" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" /></svg>
            </div>
            <div id="13-broke-c3-conf2" class="13-broke-conf">
              <div id="13-broke-c3-fill2" class="13-broke-conf-fill"></div>
              <svg viewBox="0 0 64 64" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path id="13-broke-c3-tick2" d="M20 33l8 8 16-18" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" /></svg>
            </div>
            <div id="13-broke-c3-final">
              <div id="13-broke-c3-fA" class="13-broke-val">0.000</div>
              <div id="13-broke-c3-fB" class="13-broke-val">0.100</div>
              <div class="13-broke-unit">AUSD</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const el = (n) => document.getElementById("13-broke-" + n);
      const tl = gsap.timeline({ paused: true });
      const SPRING = "back.out(1.5)";
      const PERSP = 1400;

      // ---- background: one finite bloom drift over the whole shot ----
      tl.fromTo(el("bloom-rose"), { x: 0, y: 0 }, { x: -60, y: 30, duration: 13.52, ease: "sine.inOut" }, 0);
      tl.fromTo(el("bloom-sky"), { x: 0, y: 0 }, { x: 50, y: -24, duration: 13.52, ease: "sine.inOut" }, 0);
      tl.fromTo(el("bloom-mint"), { x: 0, y: 0 }, { x: -40, y: -30, duration: 13.52, ease: "sine.inOut" }, 0);

      // ---- Scene 1 (0.0–0.9): "What broke?" springs in center, glides to top-left ----
      const TITLE_W = 450; // measured rendered width at 112px
      const TITLE_H = 108;
      const cx = (1920 - TITLE_W) / 2;
      const cy = (1080 - TITLE_H) / 2 - 30;
      tl.fromTo(el("title"), { opacity: 0, y: 50, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.3)" }, 0.05);
      tl.fromTo(el("title-pos"), { x: cx, y: cy, scale: 1 }, { x: 140, y: 118, scale: 0.7, duration: 0.65, ease: "power3.inOut" }, 0.72);

      // helpers
      const rise = (card, t) =>
        tl.fromTo(card, { opacity: 0, y: 70, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: SPRING }, t);
      const pop = (node, t, extra) =>
        tl.fromTo(node, Object.assign({ opacity: 0, scale: 0.86, y: 40 }, extra && extra.from), Object.assign({ opacity: 1, scale: 1, y: 0, duration: 0.5, ease: SPRING }, extra && extra.to), t);
      const flip = (front, back, t) => {
        tl.fromTo(front, { rotationY: 0, transformPerspective: PERSP }, { rotationY: 90, transformPerspective: PERSP, duration: 0.26, ease: "power2.in" }, t);
        tl.set(front, { autoAlpha: 0 }, t + 0.26);
        tl.set(back, { autoAlpha: 1 }, t + 0.26);
        tl.fromTo(back, { rotationY: -90, transformPerspective: PERSP }, { rotationY: 0, transformPerspective: PERSP, duration: 0.6, ease: "back.out(1.3)" }, t + 0.26);
      };
      const check = (badge, path, t) => {
        tl.fromTo(badge, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, t);
        tl.fromTo(path, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out" }, t + 0.12);
      };
      const xBadge = (badge, t) =>
        tl.fromTo(badge, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, t);

      // ---- Scene 2 (0.9–4.4): Card 1 — nonce collisions → settle one at a time ----
      rise(el("card1"), 0.9);
      // three tx packets appear spread out, then converge and collide
      const p1 = el("c1-p1"), p2 = el("c1-p2"), p3 = el("c1-p3");
      pop(p1, 1.15, { from: { x: -140, y: -60 }, to: { x: -140, y: -60 } });
      pop(p2, 1.23, { from: { x: 140, y: -50 }, to: { x: 140, y: -50 } });
      pop(p3, 1.31, { from: { x: 30, y: 60 }, to: { x: 30, y: 40 } });
      tl.to([p1, p2, p3], { x: 0, y: 0, duration: 0.4, ease: "power3.in", stagger: 0.03 }, 1.65);
      // collision: red flash + burst ring + shake
      tl.to([p1, p2, p3], { borderColor: "#c8553d", color: "#c8553d", duration: 0.12, ease: "none" }, 2.1);
      tl.fromTo(el("c1-flash"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 2.1);
      tl.to(el("c1-flash"), { opacity: 0, duration: 0.45, ease: "power2.out" }, 2.2);
      tl.fromTo(el("c1-ring"), { opacity: 0.9, scale: 0.5 }, { opacity: 0, scale: 1.5, duration: 0.6, ease: "power2.out" }, 2.1);
      tl.to(el("c1-cluster"), { keyframes: [{ x: -11 }, { x: 10 }, { x: -8 }, { x: 6 }, { x: -3 }, { x: 0 }], duration: 0.42, ease: "none" }, 2.1);
      pop(el("c1-same"), 2.2, { from: { y: 20 } });
      xBadge(el("c1-badge"), 2.25);
      // flip to the sage fix side
      flip(el("c1-front"), el("c1-back"), 2.62);
      // packets slide through the gate one at a time, landing in a settled column
      const q1 = el("c1-q1"), q2 = el("c1-q2"), q3 = el("c1-q3");
      const pass = (q, t, gx, toX, toY) => {
        tl.to(q, { keyframes: [{ x: gx, y: 0, duration: 0.22, ease: "power2.in" }, { x: toX, y: toY, duration: 0.24, ease: "power2.out" }] }, t);
        tl.to(q, { backgroundColor: "#dcebe1", borderColor: "#3f7d5c", color: "#2a543d", duration: 0.2, ease: "none" }, t + 0.16);
        tl.fromTo([el("c1-gate1"), el("c1-gate2")], { backgroundColor: "#2a543d" }, { backgroundColor: "#7fb896", duration: 0.12, ease: "none" }, t + 0.1);
        tl.to([el("c1-gate1"), el("c1-gate2")], { backgroundColor: "#2a543d", duration: 0.2, ease: "none" }, t + 0.24);
      };
      // settled column at stage x=344, y = 30 / 116 / 202
      pass(q1, 3.4, 300 - 164, 344 - 164, 30 - 128);
      tl.to(q2, { x: 82, duration: 0.26, ease: "power2.inOut" }, 3.5);
      tl.to(q3, { x: 82, duration: 0.26, ease: "power2.inOut" }, 3.55);
      pass(q2, 3.76, 300 - 82, 344 - 82, 116 - 128);
      tl.to(q3, { x: 164, duration: 0.26, ease: "power2.inOut" }, 3.86);
      pass(q3, 4.12, 300, 344, 202 - 128);
      check(el("c1-ok"), el("c1-okpath"), 4.5);

      // ---- Scene 3 (4.6–7.9): Card 2 — asset not allowed → explicit allowlist ----
      rise(el("card2"), 4.6);
      pop(el("c2-coin-bug"), 4.95);
      pop(el("c2-err"), 5.15, { from: { y: 30, scale: 0.92 } });
      tl.fromTo(el("c2-x"), { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.7)" }, 5.4);
      tl.fromTo(el("c2-strike"), { scaleX: 0, rotation: -18 }, { scaleX: 1, rotation: -18, duration: 0.3, ease: "power2.out" }, 5.45);
      tl.to(el("c2-err"), { keyframes: [{ x: -9 }, { x: 8 }, { x: -6 }, { x: 4 }, { x: 0 }], duration: 0.36, ease: "none" }, 5.6);
      xBadge(el("c2-badge"), 5.65);
      flip(el("c2-front"), el("c2-back"), 6.4);
      // AUSD coin slides into the "allowed" slot
      tl.to(el("c2-coin-fix"), { x: 216 + 112 - 46 - 20, y: 0, rotation: 360, duration: 0.6, ease: "back.out(1.3)" }, 7.2);
      tl.to(el("c2-slotfill"), { opacity: 1, duration: 0.25, ease: "power2.out" }, 7.62);
      tl.fromTo(el("c2-slot"), { scale: 1 }, { keyframes: [{ scale: 1.05 }, { scale: 1 }], duration: 0.4, ease: "power1.inOut" }, 7.62);
      check(el("c2-ok"), el("c2-okpath"), 7.78);

      // ---- Scene 4 (8.1–13.52): Card 3 — stale balances → wait 2 confirmations + poll ----
      rise(el("card3"), 8.1);
      pop(el("c3-nodeA"), 8.45);
      pop(el("c3-nodeB"), 8.55);
      tl.fromTo([el("c3-wireA"), el("c3-wireB")], { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 8.65);
      pop(el("c3-read"), 8.62);
      // the readout flickers between the two nodes' answers (deterministic beats)
      const flick = [8.95, 9.12, 9.3, 9.42, 9.6, 9.78, 9.88, 10.02, 10.14];
      flick.forEach((t, i) => {
        const showB = i % 2 === 0; // node A reports 0.100, laggy node B reports 0.000
        tl.set(el("c3-valA"), { opacity: showB ? 0 : 1 }, t);
        tl.set(el("c3-valB"), { opacity: showB ? 1 : 0 }, t);
        tl.set(el("c3-glowA"), { opacity: showB ? 1 : 0 }, t);
        tl.set(el("c3-glowB"), { opacity: showB ? 0 : 1 }, t);
      });
      xBadge(el("c3-badge"), 9.35);
      flip(el("c3-front"), el("c3-back"), 10.2);
      // two confirmations fill, then the balance settles
      tl.fromTo(el("c3-fill1"), { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(1.5)" }, 11.05);
      tl.fromTo(el("c3-tick1"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" }, 11.25);
      tl.fromTo(el("c3-trackfill"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, 11.35);
      tl.fromTo(el("c3-fill2"), { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(1.5)" }, 11.75);
      tl.fromTo(el("c3-tick2"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" }, 11.95);
      tl.to(el("c3-fA"), { opacity: 0, y: -16, duration: 0.2, ease: "power2.in" }, 12.1);
      tl.fromTo(el("c3-fB"), { opacity: 0, y: 30, scale: 0.88 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: SPRING }, 12.2);
      check(el("c3-ok"), el("c3-okpath"), 12.4);

      // hold: all three cards share one gentle finite float
      tl.fromTo(el("row"), { y: 0 }, { y: -6, duration: 1.0, ease: "sine.inOut" }, 12.52);

      window.__timelines = window.__timelines || {};
      window.__timelines["13-broke"] = tl;
    })();
  </script>
</template>
