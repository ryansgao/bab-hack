                <path id="10-x402-bbox" d="M62 104 V80 H86 M146 80 H170 V104 M170 156 V180 H146 M86 180 H62 V156" stroke="#3F7D5C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
                <g id="10-x402-bbox-tag">
                  <rect x="62" y="48" width="64" height="24" rx="6" fill="#3F7D5C" />
                  <text x="94" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#fff">mug</text>
                </g>
              </svg>
            </div>
            <div>
              <div class="10-x402-label">Result</div>
              <div class="10-x402-serif 10-x402-res-title" style="margin-top: 12px">
                Inference
                <span class="10-x402-res-check" id="10-x402-res-check">
                  <svg viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16 L13 22 L24 9" /></svg>
                </span>
              </div>
              <div class="10-x402-res-sub" id="10-x402-res-sub">detections returned</div>
            </div>
          </div>
        </div>

        <!-- travelling payment packet -->
        <div class="10-x402-packet" id="10-x402-packet"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const ID = "10-x402";
      const P = ID + "-";
      const $ = (s) => document.getElementById(P + s);
      const TOTAL = 12.005;

      const tl = gsap.timeline({ paused: true });

      /* ---------------- camera (viewport-change, single .world wrapper) ----------------
         GSAP composes translate(x, y) scale(S) on the one wrapper (origin 960 540), so the
         single-wrapper math holds: screen = S * (worldX - 960) + 960 + x  ->  x = -S * offset.
         Tweened as direct props (no onUpdate writer) so arbitrary seeks land exactly. */
      const world = $("world");
      const STEP = 1400; // world distance between stations
      gsap.set(world, { x: 0, y: 0, scale: 1, transformOrigin: "960px 540px" });

      /* ---------------- connector track + packet ---------------- */
      const NODE_X = [960, 2360, 3760, 5160, 6560];
      const packetEl = $("packet");
      const lineEl = $("line");
      const progEl = $("line-prog");
      const nodeEls = [0, 1, 2, 3, 4].map((i) => $("node-" + i));
      gsap.set(packetEl, { x: NODE_X[0] - 14, scale: 1 });
      gsap.set(progEl, { width: 0, scaleY: 1 });
      gsap.set(lineEl, { scaleY: 1 });
      gsap.set(nodeEls, { scale: 1 });

      /* ---------------- ambient ground: one finite drift each ---------------- */
      tl.fromTo($("bg-img"), { x: 0 }, { x: -70, duration: TOTAL, ease: "none" }, 0);
      tl.fromTo($("bloom-rose"), { x: 0, y: 0 }, { x: 60, y: 30, duration: TOTAL, ease: "sine.inOut" }, 0);
      tl.fromTo($("bloom-sky"), { x: 0, y: 0 }, { x: -70, y: 40, duration: TOTAL, ease: "sine.inOut" }, 0);
      tl.fromTo($("bloom-mint"), { x: 0, y: 0 }, { x: 50, y: -30, duration: TOTAL, ease: "sine.inOut" }, 0);

      /* ---------------- helpers ---------------- */
      // small things: soft spring settle (gentle overshoot)
      function spring(el, at, from) {
        const f = Object.assign({ y: 50, scale: 0.9, opacity: 0 }, from || {});
        tl.fromTo(el, f, { y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.5)" }, at);
      }
      // large things: long-tail settle, no overshoot
      function settle(el, at, from, dur) {
        const f = Object.assign({ y: 60, opacity: 0 }, from || {});
        tl.fromTo(el, f, { y: 0, scale: 1, opacity: 1, duration: dur || 1.0, ease: "expo.out" }, at);
      }
      function pan(toStation, at, dur) {
        const k = toStation;
        tl.fromTo(world, { x: -STEP * (k - 1) }, { x: -STEP * k, duration: dur, ease: "power3.inOut", immediateRender: false }, at);
        // packet leads the camera slightly on its own ease; the sage progress line follows it
        const pd = { duration: dur - 0.05, ease: "power2.inOut", immediateRender: false };
        tl.fromTo(packetEl, { x: NODE_X[k - 1] - 14 }, Object.assign({ x: NODE_X[k] - 14 }, pd), at - 0.1);
        tl.fromTo(progEl, { width: NODE_X[k - 1] - 960 }, Object.assign({ width: NODE_X[k] - 960 }, pd), at - 0.1);
        tl.fromTo($("nf-" + toStation), { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(1.6)" }, at + dur - 0.2);
      }

      /* ---------------- Scene 1 (0.0–1.0): title station ---------------- */
      tl.fromTo($("s0-label"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.08);
      settle($("s0-title"), 0.16, { y: 60, scale: 0.97, opacity: 0 }, 1.1);
      tl.fromTo($("nf-0"), { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.55);
      tl.fromTo(packetEl, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.6);

      /* ---------------- Scene 2 (1.0–3.4): AUSD chips ---------------- */
      spring($("ausd"), 1.15);
      tl.fromTo($("coin"), { scale: 0.6, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.6)" }, 1.3);
      tl.fromTo($("ausd-sub"), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.5);
      spring($("addr"), 1.95);
      spring($("scheme"), 2.5);

      /* ---------------- Scene 3 (3.4–5.6): 402 ---------------- */
      pan(1, 3.25, 1.0);
      spring($("endpoint"), 3.8, { y: 60, scale: 0.92 });
      // 402 slams in: big, no overshoot, plus a short camera jolt
      tl.fromTo($("glow402"), { opacity: 0 }, { opacity: 0.4, duration: 0.8, ease: "power2.out" }, 4.18);
      tl.fromTo($("big402"), { scale: 1.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "power4.in" }, 3.86);
      tl.fromTo(world, { y: 0 }, { y: 10, duration: 0.05, ease: "power2.out", immediateRender: false }, 4.28);
      tl.fromTo(world, { y: 10 }, { y: -5, duration: 0.08, ease: "power2.inOut", immediateRender: false }, 4.33);
      tl.fromTo(world, { y: -5 }, { y: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 4.41);
      settle($("payreq"), 4.55, { y: 40, opacity: 0 }, 0.9);
      spring($("hdr-req"), 4.95);

      /* ---------------- Scene 4 (5.6–7.8): robot signs ---------------- */
      pan(2, 5.4, 0.95);
      spring($("robot"), 5.95, { y: 60, scale: 0.92 });
      spring($("hdr-sig"), 6.05);
      spring($("code"), 6.12, { y: 50, scale: 0.94 });
      spring($("erc"), 7.45);

      // discrete-text-sequence typing
      const T0 = 6.32;
      const L1 = "transferWithAuthorization(";
      const L2 = "\n  from: robot,";
      const L3 = "\n  to: vendor,";
      const L5 = "\n  validBefore,";
      const L6 = "\n  nonce";
      const L7 = "\n)";
      const SEQ = [
        { t: 0, text: "" },
        { t: T0 + 0.0, text: "tr" },
        { t: T0 + 0.07, text: "transf" },
        { t: T0 + 0.14, text: "transferWith" },
        { t: T0 + 0.24, text: L1 },
        { t: T0 + 0.36, text: L1 + "\n  from: rob" },
        { t: T0 + 0.44, text: L1 + L2 },
        { t: T0 + 0.54, text: L1 + L2 + "\n  to: vend" },
        { t: T0 + 0.62, text: L1 + L2 + L3 },
        { t: T0 + 0.72, text: L1 + L2 + L3 + "\n  value: 60" },
        { t: T0 + 0.79, text: L1 + L2 + L3 + "\n  value: 6000" },
        { t: T0 + 0.88, text: L1 + L2 + L3 + "\n  value: 600" },
        { t: T0 + 0.94, text: L1 + L2 + L3 + "\n  value: 600," },
        { t: T0 + 1.03, text: L1 + L2 + L3 + "\n  value: 600," + L5 },
        { t: T0 + 1.11, text: L1 + L2 + L3 + "\n  value: 600," + L5 + L6 },
        { t: T0 + 1.19, text: L1 + L2 + L3 + "\n  value: 600," + L5 + L6 + L7 },
      ];
      function textAt(time) {
        for (let i = SEQ.length - 1; i >= 0; i--) if (time >= SEQ[i].t) return SEQ[i].text;
        return "";
      }
      const codeText = $("code-text");
      const cursorEl = $("cursor");
      // one full-length driver; reads the timeline's own playhead so seeks are exact
      const BLINK_CYCLES = TOTAL / 0.7;
      const driver = { t: 0 };
      tl.to(driver, {
        t: TOTAL,
        duration: TOTAL,
        ease: "none",
        lazy: false,
        onUpdate: () => {
          const t = tl.time();
          codeText.textContent = textAt(t);
          // solid while keys are flying, deterministic sin square-wave blink otherwise
          const typing = t >= T0 && t < T0 + 1.25;
          const p = (t / TOTAL) * Math.PI * 2 * BLINK_CYCLES;
          cursorEl.style.opacity = typing || Math.sin(p) > 0 ? "1" : "0";
        },
      }, 0);

      /* ---------------- Scene 5 (7.8–9.2): facilitator settles on Base ---------------- */
      pan(3, 7.6, 0.85);
      spring($("facil"), 8.05, { y: 60, scale: 0.92 });
      spring($("base"), 8.3);
      tl.fromTo($("check"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }, 8.45);
      tl.fromTo($("check-path"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out" }, 8.6);
      spring($("gas"), 8.72);
      spring($("eth"), 8.84);

      /* ---------------- Scene 6 (9.2–12.0): payment response + inference ---------------- */
      pan(4, 9.0, 0.85);
      spring($("hdr-res"), 9.45);
      spring($("result"), 9.7, { y: 60, scale: 0.92 });
      tl.fromTo($("mug"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 9.85);
      tl.fromTo($("bbox"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, 9.98);
      tl.fromTo($("bbox-tag"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 10.28);
      tl.fromTo($("res-check"), { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.7)" }, 10.12);
      tl.fromTo($("res-sub"), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 10.22);

      // bookend: pull back to show all five stations on the line
      const S = 0.28;
      const SPAN_CX = 3685; // world-x centre of stations 0..4 content
      const pb = { duration: 1.15, ease: "power3.inOut", immediateRender: false };
      tl.fromTo(world, { scale: 1, x: -STEP * 4, y: 0 }, Object.assign({ scale: S, x: -S * (SPAN_CX - 960), y: 0 }, pb), 10.5);
      // thicken the track as the camera pulls back so the line still reads in the wide shot
      tl.fromTo([lineEl, progEl], { scaleY: 1 }, Object.assign({ scaleY: 3 }, pb), 10.5);
      tl.fromTo(nodeEls, { scale: 1 }, Object.assign({ scale: 3 }, pb), 10.5);
      tl.fromTo(packetEl, { scale: 1 }, Object.assign({ scale: 3 }, pb), 10.5);
      // one finite airy drift on the hero card while the wide shot holds
      tl.to($("result"), { y: -5, duration: 1.4, ease: "sine.inOut" }, 10.6);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
