      tl.fromTo(q("#pay09-studio-label"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);

      // ================= Scene 1 (0.0–3.0s): wallet -> coins -> vendors =================
      tl.fromTo(q("#pay09-wallet"), { opacity: 0, y: 56, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: SPRING }, 0.15);
      tl.fromTo(qa(".pay09-vendor"), { opacity: 0, y: 44, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: SPRING, stagger: 0.1 }, 0.32);
      tl.set(qa(".pay09-vdot-paid"), { scale: 0, opacity: 0 }, 0);

      // coin hops: wallet (1385,222) -> each vendor dot (~1524, chip center)
      const hops = [
        { coin: "#pay09-coin-1", vendor: "#pay09-vendor-1", dx: 139, dy: -52, t: 0.95 },
        { coin: "#pay09-coin-2", vendor: "#pay09-vendor-2", dx: 139, dy: 6, t: 1.5 },
        { coin: "#pay09-coin-3", vendor: "#pay09-vendor-3", dx: 139, dy: 64, t: 2.05 },
      ];
      hops.forEach((h) => {
        const coin = q(h.coin);
        const peak = Math.min(0, h.dy) - 74;
        tl.fromTo(coin, { opacity: 0, scale: 0.55, x: 0, y: 0 }, { opacity: 1, scale: 1, duration: 0.22, ease: SPRING }, h.t - 0.2);
        tl.to(coin, { x: h.dx, duration: 0.5, ease: "power1.inOut" }, h.t);
        tl.to(coin, { y: peak, duration: 0.25, ease: "power2.out" }, h.t);
        tl.to(coin, { y: h.dy, duration: 0.25, ease: "power2.in" }, h.t + 0.25);
        tl.to(coin, { scale: 0.4, opacity: 0, duration: 0.16, ease: "power2.in" }, h.t + 0.48);
        // vendor receives the ping: chip bump + dot turns sage
        tl.to(q(h.vendor), { scale: 1.05, duration: 0.1, ease: "power2.out" }, h.t + 0.5);
        tl.to(q(h.vendor), { scale: 1, duration: 0.35, ease: SPRING }, h.t + 0.6);
        tl.to(q(h.vendor + " .pay09-vdot-paid"), { scale: 1, opacity: 1, duration: 0.3, ease: SPRING }, h.t + 0.5);
      });

      // real wallet spending allowance (supporting proof) + rails tag
      tl.fromTo(q("#pay09-allowance"), { opacity: 0, y: 50, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: SPRING }, 1.2);
      tl.fromTo(q("#pay09-tag"), { opacity: 0, y: 40, scale: 0.88 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: SPRING }, 2.55);

      // ================= Scene 2 (3.0–5.0s): receipt ledger assembles =================
      const rowStarts = [3.0, 3.38, 3.76, 4.14];
      rowStarts.forEach((t, i) => {
        const row = "#pay09-row-" + (i + 1);
        tl.fromTo(q(row), { opacity: 0, y: 54, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: SPRING }, t);
        tl.fromTo(q(row + " .pay09-settled"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: SPRING }, t + 0.18);
        tl.fromTo(qa(row + " .pay09-link"), { opacity: 0, y: 14, scale: 0.86 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: SPRING, stagger: 0.07 }, t + 0.26);
      });

      // ================= Scene 3 (5.0–7.8s): Mug delivered =================
      // plate border flashes sage as the mug is released on the tray (~5.8s)
      tl.fromTo(q("#pay09-plate-ring"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 5.68);
      tl.to(q("#pay09-plate-ring"), { opacity: 0.55, duration: 1.2, ease: "power2.inOut" }, 6.1);

      const check = q("#pay09-stamp-check");
      const checkLen = 45;
      tl.fromTo(q("#pay09-stamp"), { opacity: 0, scale: 1.32, rotation: -8, y: 0 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.55, ease: "back.out(1.4)" }, 5.72);
      tl.fromTo(check, { strokeDasharray: checkLen, strokeDashoffset: checkLen }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 5.95);

      // sparkle burst around the stamp
      const sparks = qa(".pay09-spark");
      sparks.forEach((s, i) => {
        const t = 5.86 + i * 0.05;
        tl.fromTo(s, { opacity: 0, scale: 0, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: SPRING }, t);
        tl.to(s, { opacity: 0, scale: 0.3, rotation: 30, duration: 0.45, ease: "power2.in" }, t + 0.5);
      });

      // summary chip settles under the ledger
      tl.fromTo(q("#pay09-summary"), { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: SPRING }, 6.15);
      tl.fromTo(q("#pay09-sum-num"), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: SPRING }, 6.3);

      // held beat: one finite airy drift on the stamp
      tl.to(q("#pay09-stamp"), { y: -5, duration: DUR - 6.4, ease: "sine.inOut" }, 6.4);

      window.__timelines["09-demo-pay"] = tl;
    </script>
  </div>
</template>
