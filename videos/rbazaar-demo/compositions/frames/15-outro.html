  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var el = function (id) {
        return document.getElementById("15-outro-" + id);
      };
      var DUR = 5.349;
      // Measured: wordmark "rBazaar" (Instrument Serif 168px, -0.025em) width + 40px gap.
      // The mark starts dead-center, then slides left by half of (gap + wordmark) into the lockup.
      var WM_W = 418;
      var MARK_START_X = (40 + WM_W) / 2;

      var tl = gsap.timeline({ paused: true });

      /* ---------- background: one finite drift, photo rises to ~40% ---------- */
      tl.fromTo(el("photo"), { opacity: 0.28 }, { opacity: 0.4, duration: 2.2, ease: "power1.inOut" }, 0);
      tl.fromTo(el("bloom-rose"), { x: 0, y: 0 }, { x: 70, y: 36, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo(el("bloom-sky"), { x: 0, y: 0 }, { x: -60, y: 44, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo(el("bloom-mint"), { x: 0, y: 0 }, { x: 48, y: -40, duration: DUR, ease: "sine.inOut" }, 0);

      /* ---------- Scene 1 (0.0–1.0): mark blooms + draws, wordmark slides out ---------- */
      // green square blooms from zero (gentle spring, slight rotation)
      tl.fromTo(
        el("tile"),
        { scale: 0, rotation: -12, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.6, ease: "back.out(1.5)" },
        0.04
      );
      // layer strokes draw on, top diamond first, then the two chevrons
      tl.fromTo(el("s1"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, 0.22);
      tl.fromTo(el("s2"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, 0.38);
      tl.fromTo(el("s3"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, 0.5);
      // mark slides left into the lockup as the wordmark slides out from behind it
      tl.fromTo(el("mark"), { x: MARK_START_X }, { x: 0, duration: 0.8, ease: "power3.out" }, 0.5);
      tl.fromTo(
        el("wm-clip"),
        { clipPath: "inset(-30% 100% -40% 0%)" },
        { clipPath: "inset(-30% -6% -40% 0%)", duration: 0.8, ease: "power3.out" },
        0.52
      );
      tl.fromTo(el("wm"), { x: -160 }, { x: 0, duration: 0.85, ease: "expo.out" }, 0.52);

      /* ---------- Scene 2 (1.0–3.3): tagline rises word-by-word on the VO ---------- */
      var cues = [1.0, 1.24, 1.47, 1.86, 2.25, 2.57, 2.8]; // Skills · for · every · robot · paid · per · call
      cues.forEach(function (t, i) {
        tl.fromTo(
          el("w" + i),
          { y: 44, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
          t - 0.06
        );
      });

      /* ---------- Scene 3 (3.3–5.35): chips spring in, url fades up ---------- */
      for (var c = 0; c < 5; c++) {
        tl.fromTo(
          el("c" + c),
          { y: 56, scale: 0.88, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.5)" },
          3.3 + c * 0.09
        );
      }
      tl.fromTo(el("url"), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 3.95);

      // life in the hold: near-imperceptible scale-up on the whole lockup column
      tl.fromTo(el("col"), { scale: 1 }, { scale: 1.025, duration: DUR - 1.0, ease: "none" }, 1.0);

      /* ---------- final exit (film's only real one): soft fade to the cream canvas ---------- */
      var EXIT = DUR - 0.5;
      tl.fromTo(
        el("stage"),
        { opacity: 1, y: 0, filter: "blur(0px)" },
        { opacity: 0, y: -24, filter: "blur(6px)", duration: 0.5, ease: "power2.inOut" },
        EXIT
      );
      tl.fromTo(el("atmos"), { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, EXIT);

      window.__timelines = window.__timelines || {};
      window.__timelines["15-outro"] = tl;
    })();
  </script>
